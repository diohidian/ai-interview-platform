name: CI

on:
  push:
    branches:
      - dio/submit
  pull_request:
    branches:
      - dio/submit

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

  api:
    name: Check API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: api/.ruby-version

      - name: Install dependencies
        run: bundle install

      - name: Create test configuration
        run: cp config/application.yml.sample config/application.yml

      - name: Check EventMachine TLS support
        run: bundle exec ruby -e 'require "eventmachine"; abort "EventMachine SSL is unavailable" unless EventMachine.ssl?'

      - name: Check Rails autoloading
        run: bundle exec rails zeitwerk:check
